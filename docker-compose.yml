services:
  fidl-plus:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fidl-plus
    restart: unless-stopped

    ports:
      - "8000:8000"   # aplikacja
      - "6080:6080"   # noVNC - podgląd przeglądarki przy logowaniu

    volumes:
      - ./data:/data

    environment:
      TZ: Europe/Warsaw
      DATA_DIR: /data
      NOVNC_PORT: "6080"

    # Chromium potrzebuje więcej niż domyślne 64 MB na /dev/shm
    shm_size: "1gb"
