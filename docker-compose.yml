services:
  fidl-plus:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fidl-plus
    restart: unless-stopped

    ports:
      - "8000:8000"   # application
      - "6080:6080"   # noVNC - browser preview during login

    volumes:
      - ./data:/data

    environment:
      TZ: Europe/Warsaw
      DATA_DIR: /data
      NOVNC_PORT: "6080"

    # Chromium needs more than the default 64 MB of /dev/shm
    shm_size: "1gb"
